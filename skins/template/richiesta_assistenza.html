
<section class="bg0 p-t-104 p-b-116">
    <div class="container">
        <h2 class="ltext-105 cl2 txt-center p-b-40">Assistenza Richiesta</h2>

        <div class="text-center p-b-30">
            <button id="btn-apri-input-assistenza" class="btn btn-primary">
                Richiedi Assistenza
            </button>
        </div>
        <div id="assistenza-input-wrapper" class="d-flex justify-content-center" style="display:none !important;">
            <form id="form-assistenza" class="w-100" style="max-width:500px; animation: fadeInUp 0.5s;">
                <div class="form-group">
                    <label for="testoRichiesta">Descrivi il problema</label>
                    <textarea class="form-control" id="testoRichiesta" name="testoRichiesta" rows="4" maxlength="500" required></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Invia richiesta</button>
                <div id="assistenza-alert" class="mt-3" style="display:none;"></div>
            </form>
        </div>
        <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #assistenza-input-wrapper {
            margin-bottom: 30px;
            display: none;
        }
        </style>
        <[ASSISTENZA_TABLE]>
    </div>
</section>
