/* Stili per la wishlist con effetto hover per rimuovere - identici al carrello */
.how-itemwishlist {
    cursor: pointer;
    position: relative !important;
    display: flex;
    justify-content: center;

    width: 80px;
    height: 80px;
    margin: 0 auto;

}

.how-itemwishlist img {
    width: 100%;

    object-fit: cover;
    transition: all 0.3s ease;
}

.wishlist-remove-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    pointer-events: none;
}

.wishlist-remove-overlay i {
    color: white;
    font-size: 24px;
    text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
}

.how-itemwishlist:hover .wishlist-remove-overlay {
    opacity: 1;
    visibility: visible;
}

.how-itemwishlist:hover img {

    transform: scale(1.1);
}
</style>

<script>
function clearWishlist() {
    if (confirm('Sei sicuro di voler svuotare la lista dei preferiti?')) {
        fetch('include/ajax/wishlist_ajax.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                action: 'clear_all'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Aggiorna contatori
                const countSpan = document.querySelector('.wishlist-count');
                if (countSpan) {
                    countSpan.textContent = '0';
                }
                
                const headerWishlistIcon = document.querySelector('a[href="wishlist.php"].icon-header-noti');
                if (headerWishlistIcon) {
                    headerWishlistIcon.setAttribute('data-notify', '0');
                }
                
                // Mostra messaggio vuoto
                const tbody = document.querySelector('.table-shopping-cart');
                tbody.innerHTML = `
                    <tr class="table_head">
                        <th class="column-1 text-center">Prodotto</th>
                        <th class="column-2 text-center">Nome</th>
                        <th class="column-3 text-center">Prezzo</th>
                        <th class="column-4 text-center">Aggiunto il</th>
                        <th class="column-5 text-center">Azioni</th>
                    </tr>
                    <tr>
                        <td colspan="5" class="text-center p-t-40 p-b-40">
                            <i class="fa fa-heart-o" style="font-size: 4rem; color: #ccc; margin-bottom: 20px;"></i>
                            <h3>La tua lista preferiti è vuota</h3>
                            <p>Aggiungi i tuoi prodotti preferiti cliccando sul cuore ❤️</p>
                            <a href="index.php" class="flex-c-m stext-101 cl0 size-121 bg3 bor1 hov-btn3 p-lr-15 trans-04 pointer m-t-20">
                                Continua lo Shopping
                            </a>
                        </td>
                    </tr>
                `;
            } else {
                alert('Errore nello svuotare la lista: ' + (data.message || 'Errore sconosciuto'));
            }
        })
        .catch(error => {
            console.error('❌ Errore:', error);
            alert('Errore di connessione');
        });
    }
}

function removeFromWishlist(productId) {
    if (confirm('Sei sicuro di voler rimuovere questo prodotto dai preferiti?')) {
        const row = document.querySelector(`.table_row[data-product-id="${productId}"]`);
        
        // Invia richiesta AJAX per rimuovere dai preferiti
        fetch('include/ajax/wishlist_ajax.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                action: 'remove',
                product_id: productId
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Rimuovi la riga dalla tabella con animazione
                row.style.transition = 'opacity 0.3s ease';
                row.style.opacity = '0';
                
                setTimeout(() => {
                    row.remove();
                    
                    // Aggiorna il contatore
                    const countSpan = document.querySelector('.wishlist-count');
                    if (countSpan && data.count !== undefined) {
                        countSpan.textContent = data.count;
                    }
                    
                    // Se non ci sono più prodotti, mostra messaggio vuoto
                    const remainingRows = document.querySelectorAll('.table_row');
                    if (remainingRows.length === 0) {
                        const tbody = document.querySelector('.table-shopping-cart');
                        tbody.innerHTML = `
                            <tr class="table_head">
                                <th class="column-1 text-center">Prodotto</th>
                                <th class="column-2 text-center">Nome</th>
                                <th class="column-3 text-center">Prezzo</th>
                                <th class="column-4 text-center">Aggiunto il</th>
                                <th class="column-5 text-center">Azioni</th>
                            </tr>
                            <tr>
                                <td colspan="5" class="text-center p-t-40 p-b-40">
                                    <i class="fa fa-heart-o" style="font-size: 4rem; color: #ccc; margin-bottom: 20px;"></i>
                                    <h3>La tua lista preferiti è vuota</h3>
                                    <p>Aggiungi i tuoi prodotti preferiti cliccando sul cuore ❤️</p>
                                    <a href="index.php" class="flex-c-m stext-101 cl0 size-121 bg3 bor1 hov-btn3 p-lr-15 trans-04 pointer m-t-20">
                                        Continua lo Shopping
                                    </a>
                                </td>
                            </tr>
                        `;
                    }
                }, 300);
                
                // Aggiorna anche il contatore nell'header
                const headerWishlistIcon = document.querySelector('a[href="wishlist.php"].icon-header-noti');
                if (headerWishlistIcon && data.count !== undefined) {
                    headerWishlistIcon.setAttribute('data-notify', data.count);
                }
                
                console.log('✅ Prodotto rimosso dai preferiti');
            } else {
                alert('Errore nella rimozione: ' + (data.message || 'Errore sconosciuto'));
            }
        })
        .catch(error => {
            console.error('❌ Errore:', error);
            alert('Errore di connessione');
        });
    }
}
