<div class="container mt-4">
  <h2>Aggiungi nuovo prodotto</h2>
  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label for="nome" class="form-label">Nome prodotto <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="nome" name="nome" required>
    </div>
    <div class="mb-3">
      <label for="descrizione" class="form-label">Descrizione <span class="text-danger">*</span></label>
      <textarea class="form-control" id="descrizione" name="descrizione" required></textarea>
    </div>
    <div class="mb-3">
      <label for="prezzo" class="form-label">Prezzo <span class="text-danger">*</span></label>
      <input type="number" step="0.01" class="form-control" id="prezzo" name="prezzo" required>
    </div>
    <div class="mb-3">
      <label for="quantita" class="form-label">Quantità <span class="text-danger">*</span></label>
      <input type="number" class="form-control" id="quantita" name="quantita" required>
    </div>
    <div class="mb-3">
      <label for="genere" class="form-label">Genere <span class="text-danger">*</span></label>
      <select class="form-select" id="genere" name="genere" required>
        <option value="uomo">Uomo</option>
        <option value="donna">Donna</option>
        <option value="bambino">Bambino</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="id_categoria" class="form-label">Categoria <span class="text-danger">*</span></label>
      <select class="form-select" id="id_categoria" name="id_categoria" required>
        <[CATEGORIA_OPTIONS]>
      </select>
    </div>
    <div class="mb-3">
      <label for="id_marca" class="form-label">Marca <span class="text-danger">*</span></label>
      <select class="form-select" id="id_marca" name="id_marca" required>
        <[MARCA_OPTIONS]>
      </select>
    </div>
    <div class="mb-3">
      <label for="taglia" class="form-label">Taglia <span class="text-danger">*</span></label>
      <select class="form-select" id="taglia" name="taglia" required>
        <option value="S">S</option>
        <option value="M">M</option>
        <option value="L">L</option>
        <option value="XL">XL</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="immagine" class="form-label">Immagine prodotto <span class="text-danger">*</span></label>
      <input type="file" class="form-control" id="immagine" name="immagine">
    </div>
    <button type="submit" class="btn btn-primary">Aggiungi prodotto</button>
  </form>

  <hr class="my-4">
  <h4>Aggiungi nuova categoria</h4>
  <form method="post">
    <div class="mb-3">
      <label for="nuova_categoria" class="form-label">Nome categoria</label>
      <input type="text" class="form-control" id="nuova_categoria" name="nuova_categoria" required>
    </div>
    <button type="submit" class="btn btn-secondary" name="add_categoria">Aggiungi categoria</button>
  </form>

  <h4 class="mt-4">Aggiungi nuova marca</h4>
  <form method="post">
    <div class="mb-3">
      <label for="nuova_marca" class="form-label">Nome marca</label>
      <input type="text" class="form-control" id="nuova_marca" name="nuova_marca" required>
    </div>
    <button type="submit" class="btn btn-secondary" name="add_marca">Aggiungi marca</button>
  </form>
  <div class="mt-3">
    <span class="text-success"><[SUCCESS_MESSAGE]></span>
    <span class="text-danger"><[ERROR_MESSAGE]></span>
  </div>
</div>
