<div class="container py-4">
  <div class="fw-bold h4 mb-4">Dettaglio Ordine #<[ORDER_ID]></div>
  <div class="row mb-4">
    <div class="col-md-6 mb-3">
      <div class="card p-3 h-100">
        <div class="fw-bold mb-2">Dati Cliente</div>
        <div><[CUSTOMER_DATA]></div>
      </div>
    </div>
    <div class="col-md-6 mb-3">
      <div class="card p-3 h-100">
        <div class="fw-bold mb-2">Indirizzo Spedizione</div>
        <div><[SHIPPING_ADDRESS]></div>
      </div>
    </div>
  </div>
  <div class="row mb-4">
    <div class="col-md-4 mb-3">
      <div class="card p-3 h-100">
        <div class="fw-bold mb-2">Corriere</div>
        <div><[COURIER]></div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card p-3 h-100">
        <div class="fw-bold mb-2">Metodo Pagamento</div>
        <div><[PAYMENT_METHOD]></div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card p-3 h-100">
        <div class="fw-bold mb-2">Coupon</div>
        <div><[COUPON]></div>
      </div>
    </div>
  </div>
  <div class="mb-4">
    <div class="fw-bold mb-2">Stato Spedizione</div>
    <[SHIPPING_STATUS]>
  </div>
  <div class="mb-4">
    <div class="fw-bold mb-2">Prodotti nell&#39;ordine</div>
    <[ORDER_PRODUCTS]>
  </div>
  <div class="mb-4">
    <div class="fw-bold mb-2">Totale Ordine</div>
    <div class="h5"><[ORDER_TOTAL]></div>
  </div>
</div>
