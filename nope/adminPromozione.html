<div class="container-fluid mt-4">
  <div class="row">
    <div class="col-md-6">
      <h3>Prodotti disponibili</h3>
      <div>
        <[PRODUCTS_LIST]>
      </div>
      <h4 class="mt-4">Aggiungi promozione</h4>
      <form method="post">
        <div class="mb-3">
          <label for="nome_promozione" class="form-label">Nome promozione</label>
          <input type="text" class="form-control" id="nome_promozione" name="nome_promozione" required>
        </div>
        <div class="mb-3">
          <label for="descrizione" class="form-label">Descrizione</label>
          <textarea class="form-control" id="descrizione" name="descrizione" rows="2" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Prodotti</label>
          <div class="row row-cols-2 g-2">
            <[PRODUCT_CHECKBOXES]>
          </div>
        </div>
        <div class="mb-3">
          <label for="sconto" class="form-label">Sconto (%)</label>
          <input type="number" class="form-control" id="sconto" name="sconto" min="1" max="100" required>
        </div>
        <div class="mb-3">
          <label for="data_inizio" class="form-label">Data inizio</label>
          <input type="date" class="form-control" id="data_inizio" name="data_inizio" required>
        </div>
        <div class="mb-3">
          <label for="data_fine" class="form-label">Data fine</label>
          <input type="date" class="form-control" id="data_fine" name="data_fine" required>
        </div>
        <button type="submit" name="add_promozione" class="btn btn-success">Aggiungi promozione</button>
      </form>
      <div class="mt-3">
        <span id="promo-success" class="text-success" style="display:none;"><[PROMO_SUCCESS]></span>
        <span id="promo-error" class="text-danger" style="display:none;"><[PROMO_ERROR]></span>
      </div>
      <script>
        window.addEventListener('DOMContentLoaded', function() {
          var success = document.getElementById('promo-success');
          var error = document.getElementById('promo-error');
          if (success.textContent.trim() !== "") {
            success.style.display = 'inline';
            setTimeout(function() { success.style.display = 'none'; }, 2000);
          }
          if (error.textContent.trim() !== "") {
            error.style.display = 'inline';
            setTimeout(function() { error.style.display = 'none'; }, 2000);
          }
        });
      </script>
    </div>
    <div class="col-md-6">
      <h3>Promozioni attive</h3>
      <div class="table-responsive mt-3">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th>Nome</th>
              <th>Descrizione</th>
              <th>Sconto</th>
              <th>Inizio</th>
              <th>Fine</th>
            </tr>
          </thead>
          <tbody>
            <[PROMO_LIST]>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
